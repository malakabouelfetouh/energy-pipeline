[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-pipeline"
version = "0.1.0"
description = "Pipeline for effect of weather on German electricity prices"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "psycopg[binary]",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]